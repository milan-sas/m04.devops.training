version: v1.0
name: Build and Push Docker Image
agent:
  machine:
    type: s1-ubuntu
    os_image: ''
blocks:
  - name: Build and Push
    task:
      secrets:
        - name: dockerhub-credentials
      jobs:
        - name: Docker build and push
          commands:
            - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
            - 'docker build -t $DOCKER_USERNAME/your-image-name:$SEMAPHORE_GIT_SHA 8-pipeline/'
            - 'docker tag $DOCKER_USERNAME/your-image-name:$SEMAPHORE_GIT_SHA $DOCKER_USERNAME/your-image-name:latest'
            - 'docker push $DOCKER_USERNAME/your-image-name:$SEMAPHORE_GIT_SHA'
            - 'docker push $DOCKER_USERNAME/your-image-name:latest'
